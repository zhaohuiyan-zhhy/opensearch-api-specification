  /_plugins/_neural/clear_cache/{index}:
    post:
      operationId: neural.clear_cache.0
      x-operation-group: neural.clear_cache
      x-version-added: '3.3'
      description: Evicts neural sparse index data from the cache.
      parameters:
        - $ref: '#/components/parameters/neural.clear_cache::path.index'
      responses:
        '200':
          $ref: '#/components/responses/neural.clear_cache@200'
  /_plugins/_neural/warmup/{index}:
    post:
      operationId: neural.warmup.0
      x-operation-group: neural.warmup
      x-version-added: '3.3'
      description: Loads neural sparse index data into the cache.
      parameters:
        - $ref: '#/components/parameters/neural.warmup::path.index'
      responses:
        '200':
          $ref: '#/components/responses/neural.warmup@200'
components:
  responses:
    neural.clear_cache@200:
      description: Successful response containing shard results.
      content:
        application/json:
          schema:
            $ref: '../schemas/_common.yaml#/components/schemas/ShardsOperationResponseBase'
    neural.warmup@200:
      description: Successful response containing shard results.
      content:
        application/json:
          schema:
            $ref: '../schemas/_common.yaml#/components/schemas/ShardsOperationResponseBase'
    neural.stats@200:
      description: Successful response containing neural stats
      content:
        application/json:
          schema:
            $ref: '../schemas/neural._common.yaml#/components/schemas/NeuralStats'
  parameters:
    neural.clear_cache::path.index:
      name: index
      in: path
      description: A comma-separated list of indexes.
      required: true
      style: simple
      schema:
        type: array
        items:
          type: string
    neural.warmup::path.index:
      name: index
      in: path
      description: A comma-separated list of indexes.
      required: true
      style: simple
      schema:
        type: array
        items:
          type: string
    neural.stats::path.node_id:
      name: node_id
      in: path
      description: A comma-separated list of node IDs or names to limit the returned information; leave empty to get information from all nodes.
      schema:
        type: string
      required: true
    neural.stats::path.stat:
      name: stat
      in: path
      description: A comma-separated list of stats to retrieve; use empty string to retrieve all stats.
      schema:
        oneOf:
          - $ref: '../schemas/neural._common.yaml#/components/schemas/NeuralStatName'
          - type: array
            items:
              $ref: '../schemas/neural._common.yaml#/components/schemas/NeuralStatName'
      required: true
      style: simple
    neural.stats::query.flat_stat_paths:
      in: query
      name: flat_stat_paths
      description: |- 
        Whether to return stats in the flat form, which can improve readability, especially for heavily nested stats.
        For example, the flat form of `"processors": { "ingest": { "text_embedding_executions": 20181212 } }` is 
        `"processors.ingest.text_embedding_executions": "20181212"`.
      schema:
        type: boolean
        default: false
      style: form
    neural.stats::query.include_all_nodes:
      in: query
      name: include_all_nodes
      description: |- 
        When `true` includes aggregated statistics across all nodes in the `all_nodes` category.
        When `false`, excludes the `all_nodes` category from the response.
      schema:
        type: boolean
        default: true
      style: form
      x-version-added: '3.1'
    neural.stats::query.include_individual_nodes:
      in: query
      name: include_individual_nodes
      description: |- 
        When `true` includes statistics for individual nodes in the `nodes` category.
        When `false`, excludes the `nodes` category from the response.
      schema:
        type: boolean
        default: true
      style: form
      x-version-added: '3.1'
    neural.stats::query.include_info:
      in: query
      name: include_info
      description: |- 
        When `true` includes cluster-wide information in the `info` category.
        When `false`, excludes the `info` category from the response.
      schema:
        type: boolean
        default: true
      style: form
      x-version-added: '3.1'
    neural.stats::query.include_metadata:
      in: query
      name: include_metadata
      description: |- 
        Whether to return stat metadata instead of the raw stat value, includes additional information about the stat.
        These can include things like type hints, time since last stats being recorded, or recent rolling interval values
      schema:
        type: boolean
        default: false
      style: form
