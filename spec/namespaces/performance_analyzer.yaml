components:
  parameters:
    performance_analyzer.get_cluster_config::query.verbose:
      name: verbose
      in: query
      description: Returns per-feature cluster state values when true.
      schema:
        type: boolean
        default: false
      required: false
    performance_analyzer.proxy_agent_resource::path.redirect_endpoint:
      name: redirect_endpoint
      in: path
      description: The Performance Analyzer agent resource to proxy.
      schema:
        $ref: '../schemas/performance_analyzer._common.yaml#/components/schemas/AgentRedirectEndpoint'
      required: true
    performance_analyzer.update_cluster_config::query.verbose:
      name: verbose
      in: query
      description: Returns per-feature cluster state values when true.
      schema:
        type: boolean
        default: false
      required: false

  requestBodies:
    performance_analyzer.update_cluster_config:
      content:
        application/json:
          schema:
            $ref: '../schemas/performance_analyzer._common.yaml#/components/schemas/ClusterConfigRequest'
    performance_analyzer.update_cluster_overrides:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/performance_analyzer._common.yaml#/components/schemas/ConfigOverrides'
    performance_analyzer.update_local_config:
      content:
        application/json:
          schema:
            $ref: '../schemas/performance_analyzer._common.yaml#/components/schemas/LocalConfigRequest'

  responses:
    performance_analyzer.get_cluster_config@200:
      content:
        application/json:
          schema:
            $ref: '../schemas/performance_analyzer._common.yaml#/components/schemas/ClusterConfigResponse'
    performance_analyzer.get_cluster_overrides@200:
      content:
        application/json:
          schema:
            $ref: '../schemas/performance_analyzer._common.yaml#/components/schemas/ConfigOverridesResponse'
    performance_analyzer.get_local_config@200:
      content:
        application/json:
          schema:
            $ref: '../schemas/performance_analyzer._common.yaml#/components/schemas/LocalConfigResponse'
    performance_analyzer.proxy_agent_resource@200:
      content:
        application/json:
          schema:
            $ref: '../schemas/performance_analyzer._common.yaml#/components/schemas/AgentResponse'
    performance_analyzer.proxy_agent_resource@404:
      content:
        text/plain:
          schema:
            type: string
    performance_analyzer.proxy_agent_resource@500:
      content:
        application/json:
          schema:
            $ref: '../schemas/_common.yaml#/components/schemas/ErrorResponseBase'
    performance_analyzer.update_cluster_overrides@200:
      content:
        application/json:
          schema:
            $ref: '../schemas/performance_analyzer._common.yaml#/components/schemas/ConfigOverrideUpdateResponse'
    performance_analyzer.update_cluster_overrides@400:
      content:
        application/json:
          schema:
            $ref: '../schemas/performance_analyzer._common.yaml#/components/schemas/ConfigOverrideErrorResponse'
    performance_analyzer.update_cluster_config@200:
      content:
        application/json:
          schema:
            $ref: '../schemas/performance_analyzer._common.yaml#/components/schemas/ClusterConfigResponse'
    performance_analyzer.update_local_config@200:
      content:
        application/json:
          schema:
            $ref: '../schemas/performance_analyzer._common.yaml#/components/schemas/LocalConfigResponse'
    performance_analyzer.update_local_config@400:
      content:
        application/json:
          schema:
            $ref: '../schemas/_common.yaml#/components/schemas/ErrorResponseBase'
