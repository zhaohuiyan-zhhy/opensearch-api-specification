openapi: 3.1.0
info:
  title: Schemas of query insights
  description: Schemas of query insights
  version: 1.0.0
paths: {}
components:
  schemas:
    LiveQueriesResponse:
      type: object
      properties:
        live_queries:
          type: array
          items:
            $ref: '#/components/schemas/LiveQueryRecord'
        finished_queries:
          type: array
          x-version-added: '3.6'
          items:
            $ref: '#/components/schemas/FinishedQueryRecord'
      required:
        - live_queries
    LiveQueryRecord:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        start_time:
          type: integer
          format: int64
        wlm_group_id:
          type: string
        total_latency_millis:
          type: integer
          format: int64
        total_cpu_nanos:
          type: integer
          format: int64
        total_memory_bytes:
          type: integer
          format: int64
        coordinator_task:
          $ref: '#/components/schemas/LiveQueryTaskDetails'
        shard_tasks:
          type: array
          items:
            $ref: '#/components/schemas/LiveQueryTaskDetails'
        username:
          type: string
          x-version-added: '3.8'
        user_roles:
          type: array
          x-version-added: '3.8'
          items:
            type: string
        backend_roles:
          type: array
          x-version-added: '3.8'
          items:
            type: string
      required:
        - id
        - shard_tasks
        - start_time
        - status
        - total_cpu_nanos
        - total_latency_millis
        - total_memory_bytes
    LiveQueryTaskDetails:
      type: object
      properties:
        task_id:
          type: string
        node_id:
          type: string
        action:
          type: string
        status:
          type: string
        description:
          type: string
        start_time:
          type: integer
          format: int64
        running_time_nanos:
          type: integer
          format: int64
        cpu_nanos:
          type: integer
          format: int64
        memory_bytes:
          type: integer
          format: int64
      required:
        - action
        - cpu_nanos
        - memory_bytes
        - node_id
        - running_time_nanos
        - start_time
        - status
        - task_id
    FinishedQueryRecord:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        timestamp:
          type: integer
          format: int64
        top_n_id:
          type: string
        status:
          type: string
        measurements:
          $ref: '#/components/schemas/Measurements'
      required:
        - id
        - measurements
        - status
        - timestamp
    HealthStatsResponse:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/QueryInsightsNodeHealthStats'
    QueryInsightsNodeHealthStats:
      type: object
      properties:
        ThreadPoolInfo:
          type: object
          additionalProperties: true
        QueryRecordsQueueSize:
          type: integer
        TopQueriesHealthStats:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TopQueriesMetricHealthStats'
        FieldTypeCacheStats:
          $ref: '#/components/schemas/FieldTypeCacheStats'
      required:
        - FieldTypeCacheStats
        - QueryRecordsQueueSize
        - ThreadPoolInfo
        - TopQueriesHealthStats
    TopQueriesMetricHealthStats:
      type: object
      properties:
        TopQueriesHeapSize:
          type: integer
        QueryGroupCount_Total:
          type: integer
        QueryGroupCount_MaxHeap:
          type: integer
      required:
        - QueryGroupCount_MaxHeap
        - QueryGroupCount_Total
        - TopQueriesHeapSize
    FieldTypeCacheStats:
      type: object
      properties:
        size_in_bytes:
          type: integer
          format: int64
        entry_count:
          type: integer
          format: int64
        evictions:
          type: integer
          format: int64
        hit_count:
          type: integer
          format: int64
        miss_count:
          type: integer
          format: int64
      required:
        - entry_count
        - evictions
        - hit_count
        - miss_count
        - size_in_bytes
    QueryInsightsMetricSettings:
      type: object
      properties:
        enabled:
          type: boolean
        top_n_size:
          type: integer
        window_size:
          type: string
    QueryInsightsGroupingSettings:
      type: object
      properties:
        group_by:
          $ref: '#/components/schemas/GroupingType'
    QueryInsightsExporterSettings:
      type: object
      properties:
        type:
          type: string
        delete_after_days:
          type: integer
    QueryInsightsSettings:
      type: object
      properties:
        latency:
          $ref: '#/components/schemas/QueryInsightsMetricSettings'
        cpu:
          $ref: '#/components/schemas/QueryInsightsMetricSettings'
        memory:
          $ref: '#/components/schemas/QueryInsightsMetricSettings'
        grouping:
          $ref: '#/components/schemas/QueryInsightsGroupingSettings'
        exporter:
          $ref: '#/components/schemas/QueryInsightsExporterSettings'
    GetQueryInsightsSettingsResponse:
      type: object
      properties:
        persistent:
          $ref: '#/components/schemas/QueryInsightsSettings'
      required:
        - persistent
    MetricType:
      type: string
      enum:
        - cpu
        - latency
        - memory
    TopQueriesResponse:
      type: object
      properties:
        top_queries:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/TopQuery'
      required:
        - top_queries
    TopQuery:
      type: object
      properties:
        id:
          type: string
        group_by:
          $ref: '#/components/schemas/GroupingType'
        timestamp:
          type: integer
          format: int64
          description: The timestamp of the query execution.
        total_shards:
          type: integer
          description: The total number of shards involved in the query.
        task_resource_usages:
          type: array
          items:
            $ref: '#/components/schemas/TaskResourceUsages'
        query_group_hashcode:
          type: string
          x-version-added: '2.19'
          description: The hash code of the query group.
        labels:
          type: object
          description: Additional labels for the query.
          additionalProperties:
            type: string
        search_type:
          type: string
          description: The search query type (for example, `query_then_fetch`).
        source:
          type: string
          description: The search request body serialized as a JSON string.
        source_truncated:
          type: boolean
          x-version-added: '3.5'
          description: Whether the serialized source was truncated.
        node_id:
          type: string
          description: The node ID associated with the query.
        indices:
          type: array
          items:
            type: string
          description: The indexes involved in the query.
        phase_latency_map:
          type: object
          additionalProperties:
            type: integer
            format: int64
        measurements:
          $ref: '#/components/schemas/Measurements'
        description:
          type: string
          x-version-added: '3.0'
          description: A description of the query task.
        is_cancelled:
          type: boolean
          x-version-added: '3.1'
          description: Whether the query was cancelled.
        wlm_group_id:
          type: string
          x-version-added: '3.3'
          description: The workload management group ID associated with the query.
        username:
          type: string
          x-version-added: '3.5'
          description: The username that initiated the query.
        user_roles:
          type: array
          x-version-added: '3.5'
          items:
            type: string
          description: The roles of the user that initiated the query.
        backend_roles:
          type: array
          x-version-added: '3.6'
          items:
            type: string
          description: The backend roles of the user that initiated the query.
        failed:
          type: boolean
          x-version-added: '3.6'
          description: Whether the query failed during execution.
        recommendations:
          type: array
          x-version-added: '3.8'
          items:
            $ref: '#/components/schemas/QueryRecommendation'
    QueryRecommendation:
      type: object
      properties:
        id:
          type: string
        rule_id:
          type: string
        title:
          type: string
        description:
          type: string
        type:
          $ref: '#/components/schemas/RecommendationType'
        action:
          $ref: '#/components/schemas/RecommendationAction'
        impact:
          $ref: '#/components/schemas/RecommendationImpactVector'
        confidence:
          type: number
        metadata:
          type: object
          additionalProperties: true
      required:
        - confidence
        - description
        - rule_id
        - title
        - type
    RecommendationType:
      type: string
      enum:
        - correctness
        - feature_enable
        - index_config
        - query_rewrite
    RecommendationAction:
      type: object
      properties:
        name:
          type: string
        hint:
          type: string
        documentation_url:
          type: string
        suggested_query:
          type: string
    RecommendationImpactVector:
      type: object
      properties:
        latency:
          $ref: '#/components/schemas/RecommendationImpact'
        cpu:
          $ref: '#/components/schemas/RecommendationImpact'
        memory:
          $ref: '#/components/schemas/RecommendationImpact'
        correctness:
          $ref: '#/components/schemas/RecommendationImpact'
        estimated_improvement:
          type: string
    RecommendationImpact:
      type: object
      properties:
        direction:
          $ref: '#/components/schemas/RecommendationImpactDirection'
        value:
          type: number
    RecommendationImpactDirection:
      type: string
      enum:
        - negative
        - neutral
        - positive
    GroupingType:
      type: string
      enum:
        - NONE
        - SIMILARITY
        - none
        - similarity
    TaskResourceUsages:
      type: object
      properties:
        action:
          type: string
          description: The action type of the task.
        taskId:
          type: integer
          description: The task ID.
        parentTaskId:
          type: integer
          description: The parent task ID.
        nodeId:
          type: string
          description: The node ID where the task was executed.
        taskResourceUsage:
          type: object
          $ref: '#/components/schemas/TaskResourceUsage'
    TaskResourceUsage:
      type: object
      properties:
        cpu_time_in_nanos:
          type: integer
          description: The CPU time used in nanoseconds.
        memory_in_bytes:
          type: integer
          description: The memory usage in bytes.
    Measurement:
      type: object
      properties:
        number:
          type: integer
        count:
          type: integer
        aggregationType:
          type: string
    Measurements:
      type: object
      properties:
        latency:
          type: object
          $ref: '#/components/schemas/Measurement'
        cpu:
          type: object
          $ref: '#/components/schemas/Measurement'
        memory:
          type: object
          $ref: '#/components/schemas/Measurement'