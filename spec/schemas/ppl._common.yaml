openapi: 3.1.0
info:
  title: Schemas of `ppl._common` Category.
  description: Schemas of `ppl._common` category.
  version: 1.0.0
paths: {}
components:
  schemas:
    ResponseFormat:
      type: string
      description: |-
        The response format selector for PPL plugin operations. The valid set is the union of values accepted across `_plugins/_ppl/*` endpoints;
        defaults and per-endpoint subsets mirror the SQL plugin.
      default: jdbc
      enum:
        - cost
        - csv
        - extended
        - jdbc
        - json
        - raw
        - simple
        - standard
        - viz
        - yaml

    GrammarBundle:
      type: object
      properties:
        bundleVersion:
          type: string
        antlrVersion:
          type: string
        grammarHash:
          type: string
        startRuleIndex:
          type: integer
        lexerSerializedATN:
          type: array
          items:
            type: integer
        lexerRuleNames:
          type: array
          items:
            type: string
        channelNames:
          type: array
          items:
            type: string
        modeNames:
          type: array
          items:
            type: string
        parserSerializedATN:
          type: array
          items:
            type: integer
        parserRuleNames:
          type: array
          items:
            type: string
        literalNames:
          type: array
          items:
            type: string
            nullable: true
        symbolicNames:
          type: array
          items:
            type: string
            nullable: true
        tokenDictionary:
          type: object
          additionalProperties:
            type: integer
        ignoredTokens:
          type: array
          items:
            type: integer
        rulesToVisit:
          type: array
          items:
            type: integer
      required:
        - bundleVersion
        - antlrVersion
        - grammarHash
        - startRuleIndex
        - lexerSerializedATN
        - lexerRuleNames
        - channelNames
        - modeNames
        - parserSerializedATN
        - parserRuleNames
        - literalNames
        - symbolicNames
        - tokenDictionary
        - ignoredTokens
        - rulesToVisit
