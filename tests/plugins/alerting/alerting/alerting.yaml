  - synopsis: Acknowledge a monitor alert.
    path: /_plugins/_alerting/monitors/{monitor_id}/_acknowledge/alerts
    method: POST
    parameters:
      monitor_id: ${create_monitor.monitor_id}
      refresh: true
    request:
      payload:
        alerts:
          - ${current_alerts.alert_id}
    response:
