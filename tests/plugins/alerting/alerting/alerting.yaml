  - synopsis: Create a workflow.
    id: create_workflow
    path: /_plugins/_alerting/workflows
    method: POST
    parameters:
      refresh: true
    request:
      payload:
        type: workflow
        schema_version: 0
        name: alerting-spec-workflow
        workflow_type: composite
        enabled: false
        schedule:
          period:
            interval: 5
            unit: MINUTES
        inputs:
          - composite_input:
              sequence:
                delegates:
                  - order: 1
                    monitor_id: ${create_monitor.monitor_id}
        triggers: []
        audit_delegate_monitor_alerts: true
    response:
      status: 201
    output:
      workflow_id: payload._id
  - synopsis: Get a workflow.
    path: /_plugins/_alerting/workflows/{workflow_id}
