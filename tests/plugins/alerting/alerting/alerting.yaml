$schema: ../../../../json_schemas/test_story.schema.yaml

description: Test the OpenSearch Alerting API.
warnings:
  invalid-path-detected: false
  multiple-paths-detected: false

prologues:
  - path: /alerting-spec-data
    method: PUT
    request:
      payload:
        mappings:
          properties:
            message:
              type: keyword
  - path: /alerting-spec-data/_doc
    method: POST
    parameters:
      refresh: true
    request:
      payload:
        message: test
  - path: /_cat/nodes
    id: node
    method: GET
    parameters:
      format: json
      full_id: true
      h: id
      size: 1
    output:
      id: payload[0].id

chapters:
  - synopsis: Create a monitor.
    id: create_monitor
    path: /_plugins/_alerting/monitors
    method: POST
    parameters:
      refresh: true
    request:
      payload:
        type: monitor
        schema_version: 0
        name: alerting-spec-current
        monitor_type: query_level_monitor
        enabled: false
        schedule:
          period:
            interval: 5
            unit: MINUTES
        inputs:
          - search:
              indices: [alerting-spec-data]
              query:
                size: 0
                query:
                  match_all: {}
        triggers:
          - query_level_trigger:
              id: current-trigger
              name: always
              severity: '1'
              condition:
                script:
                  source: return true
                  lang: painless
              actions: []
    response:
      status: 201
    output:
      monitor_id: payload._id
  - synopsis: Create a monitor with the legacy route.
    id: create_legacy_monitor
    path: /_opendistro/_alerting/monitors
    method: POST
