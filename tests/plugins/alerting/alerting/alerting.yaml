    path: /_plugins/_alerting/monitors/_search
    method: GET
    request:
      payload:
        query:
          match_all: {}
    response:
      status: 200
  - synopsis: Search monitors. [POST]
    path: /_plugins/_alerting/monitors/_search
    method: POST
    request:
      payload:
        query:
          match_all: {}
    response:
      status: 200
  - synopsis: Search monitors with the legacy route. [GET]
