$schema: ../../../../json_schemas/test_story.schema.yaml

description: Tests indexed asynchronous search routes and node stats.
version: '>= 1.0'

prologues:
  - path: /{index}
    method: PUT
    parameters:
      index: async_test
    response:
      status: 200

epilogues:
  - path: /{index}
    method: DELETE
    parameters:
      index: async_test
    response:
      status: 200

chapters:
  - synopsis: Submit an asynchronous search for an index.
    path: /{index}/_plugins/_asynchronous_search
    method: POST
    parameters:
      index: async_test
    request:
      payload:
        query:
          match_all: {}
    response:
      status: 200
  - synopsis: Get asynchronous search stats for all nodes.
    path: /_plugins/_asynchronous_search/_nodes/{node_id}/stats
    method: GET
    parameters:
      node_id:
        - _all
    response:
      status: 200
