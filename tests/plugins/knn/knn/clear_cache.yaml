$schema: ../../../../json_schemas/test_story.schema.yaml

description: Clear native k-NN cache entries for an index.
version: '>= 2.14'

prologues:
  - path: /{index}
    method: PUT
    parameters:
      index: knn_clear_cache_test
    request:
      payload:
        settings:
          index.knn: true
        mappings:
          properties:
            vector:
              type: knn_vector
              dimension: 2
    response:
      status: 200

epilogues:
  - path: /{index}
    method: DELETE
    parameters:
      index: knn_clear_cache_test
    response:
      status: 200

chapters:
  - synopsis: Clear the k-NN cache for an index.
    path: /_plugins/_knn/clear_cache/{index}
    method: POST
    parameters:
      index:
        - knn_clear_cache_test
    response:
      status: 200
