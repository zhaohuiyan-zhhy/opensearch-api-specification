$schema: ../../../../json_schemas/test_story.schema.yaml

description: Tests HEAD routes for LTR resources.
version: '>= 2.17.1'

prologues:
  - path: /_ltr
    method: PUT
    response:
      status: 200
  - path: /_ltr/custom_store
    method: PUT
    response:
      status: 200

epilogues:
  - path: /_ltr/custom_store
    method: DELETE
    response:
      status: [200, 404]
  - path: /_ltr
    method: DELETE
    response:
      status: [200, 404]

chapters:
  - synopsis: Check for a feature in the default store.
    path: /_ltr/_feature/{id}
    method: HEAD
    parameters:
      id: missing_feature
    response:
      status: 404
  - synopsis: Check for a feature in a named store.
    path: /_ltr/{store}/_feature/{id}
    method: HEAD
    parameters:
      store: custom_store
      id: missing_feature
    response:
      status: 404
  - synopsis: Check for a feature set in the default store.
    path: /_ltr/_featureset/{id}
    method: HEAD
    parameters:
      id: missing_featureset
    response:
      status: 404
  - synopsis: Check for a feature set in a named store.
    path: /_ltr/{store}/_featureset/{id}
    method: HEAD
    parameters:
      store: custom_store
      id: missing_featureset
    response:
      status: 404
  - synopsis: Check for a model in the default store.
    path: /_ltr/_model/{id}
    method: HEAD
    parameters:
      id: missing_model
    response:
      status: 404
  - synopsis: Check for a model in a named store.
    path: /_ltr/{store}/_model/{id}
    method: HEAD
    parameters:
      store: custom_store
      id: missing_model
    response:
      status: 404
