$schema: ../../../../json_schemas/test_story.schema.yaml

description: Tests current and legacy LTR stats routes.
version: '>= 2.19'

chapters:
  - synopsis: Get current LTR stats with the registered trailing slash.
    path: /_plugins/_ltr/stats/
    method: GET
    response:
      status: 200
  - synopsis: Get current LTR stats for all nodes with the registered trailing slash.
    path: /_plugins/_ltr/{node_id}/stats/
    method: GET
    parameters:
      node_id:
        - _all
    response:
      status: 200
  - synopsis: Get legacy LTR stats.
    path: /_opendistro/_ltr/stats/
    method: GET
    response:
      status: 200
  - synopsis: Get one legacy LTR stat.
    path: /_opendistro/_ltr/stats/{stat}
    method: GET
    parameters:
      stat:
        - status
    response:
      status: 200
  - synopsis: Get legacy LTR stats for all nodes.
    path: /_opendistro/_ltr/{node_id}/stats/
    method: GET
    parameters:
      node_id:
        - _all
    response:
      status: 200
  - synopsis: Get one legacy LTR stat for all nodes.
    path: /_opendistro/_ltr/{node_id}/stats/{stat}
    method: GET
    parameters:
      node_id:
        - _all
      stat:
        - status
    response:
      status: 200
