$schema: ../../../../json_schemas/test_story.schema.yaml

description: Test index insight configuration APIs.
version: '>= 3.8'
warnings:
  invalid-path-detected: false
prologues:
  - path: /_cluster/settings
    method: PUT
    request:
      payload:
        persistent:
          plugins.ml_commons.agent_framework_enabled: true
          plugins.ml_commons.index_insight_feature_enabled: true
chapters:
  - synopsis: Enable index insights.
    path: /_plugins/_ml/index_insight_config/
    method: PUT
    request:
      payload:
        is_enable: true
    response:
      status: 200
      payload:
        acknowledged: true
  - synopsis: Get the index insight configuration.
    path: /_plugins/_ml/index_insight_config/
    method: GET
    response:
      status: 200
      payload:
        is_enable: true
