$schema: ../../../../json_schemas/test_story.schema.yaml

description: Tests the neural sparse warmup API.
version: '>= 3.3'

prologues:
  - path: /{index}
    method: PUT
    parameters:
      index: neural-sparse-warmup-test
    request:
      payload:
        settings:
          index:
            sparse: true
            number_of_shards: 1
            number_of_replicas: 0
        mappings:
          properties:
            sparse_field:
              type: sparse_vector
              method:
                name: seismic
                parameters:
                  n_postings: 100
                  summary_prune_ratio: 0.4
                  cluster_ratio: 0.1
                  approximate_threshold: 100
    response:
      status: 200

epilogues:
  - path: /{index}
    method: DELETE
    parameters:
      index: neural-sparse-warmup-test
    status: [200, 404]

chapters:
  - synopsis: Warm up neural sparse index data.
    path: /_plugins/_neural/warmup/{index}
    method: POST
    parameters:
      index:
        - neural-sparse-warmup-test
    response:
      status: 200
      payload:
        _shards:
          total: 1
          successful: 1
          failed: 0
