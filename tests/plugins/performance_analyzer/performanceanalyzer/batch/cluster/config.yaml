$schema: ../../../../../../json_schemas/test_story.schema.yaml

description: Test the Performance Analyzer batch metrics cluster configuration API.
chapters:
  - synopsis: Get the batch metrics cluster configuration.
    method: GET
    path: /_plugins/_performanceanalyzer/batch/cluster/config
    response:
      status: 200
  - synopsis: Update the batch metrics cluster configuration.
    method: POST
    path: /_plugins/_performanceanalyzer/batch/cluster/config
    request:
      payload:
        enabled: false
    response:
      status: 200
