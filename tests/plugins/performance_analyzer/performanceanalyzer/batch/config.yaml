$schema: ../../../../../json_schemas/test_story.schema.yaml

description: Test the Performance Analyzer batch metrics local configuration API.
chapters:
  - synopsis: Get the batch metrics local configuration.
    method: GET
    path: /_plugins/_performanceanalyzer/batch/config
    response:
      status: 200
  - synopsis: Update the batch metrics local configuration.
    method: POST
    path: /_plugins/_performanceanalyzer/batch/config
    request:
      payload:
        enabled: false
    response:
      status: 200
