$schema: ../../../../../../json_schemas/test_story.schema.yaml

description: Test the Performance Analyzer logging cluster configuration API.
chapters:
  - synopsis: Get the logging cluster configuration.
    method: GET
    path: /_plugins/_performanceanalyzer/logging/cluster/config
    response:
      status: 200
  - synopsis: Update the logging cluster configuration.
    method: POST
    path: /_plugins/_performanceanalyzer/logging/cluster/config
    request:
      payload:
        enabled: false
    response:
      status: 200
