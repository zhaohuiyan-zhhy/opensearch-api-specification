$schema: ../../../../../json_schemas/test_story.schema.yaml

description: Test the Performance Analyzer logging local configuration API.
chapters:
  - synopsis: Get the logging local configuration.
    method: GET
    path: /_plugins/_performanceanalyzer/logging/config
    response:
      status: 200
  - synopsis: Update the logging local configuration.
    method: POST
    path: /_plugins/_performanceanalyzer/logging/config
    request:
      payload:
        enabled: false
    response:
      status: 200
