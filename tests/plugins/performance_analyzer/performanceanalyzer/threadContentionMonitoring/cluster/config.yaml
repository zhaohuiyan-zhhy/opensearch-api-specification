$schema: ../../../../../../json_schemas/test_story.schema.yaml

description: Test the Performance Analyzer thread contention monitoring cluster configuration API.
chapters:
  - synopsis: Get the thread contention monitoring cluster configuration.
    method: GET
    path: /_plugins/_performanceanalyzer/threadContentionMonitoring/cluster/config
    response:
      status: 200
  - synopsis: Update the thread contention monitoring cluster configuration.
    method: POST
    path: /_plugins/_performanceanalyzer/threadContentionMonitoring/cluster/config
    request:
      payload:
        enabled: false
    response:
      status: 200
